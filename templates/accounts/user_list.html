{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between mb-3"><h4>Users</h4>
<a href="{% url 'accounts:user_create' %}" class="btn btn-primary"><i class="bi bi-plus"></i> New User</a></div>
<div class="card"><table class="table mb-0">
<thead class="table-light"><tr><th>Username</th><th>Name</th><th>Role</th><th>Email</th><th>Active</th></tr></thead>
<tbody>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.get_full_name }}</td>
<td><span class="badge bg-info">{{ u.get_role_display }}</span></td><td>{{ u.email }}</td>
<td>{% if u.is_active %}<span class="badge bg-success">Yes</span>{% else %}<span class="badge bg-secondary">No</span>{% endif %}</td>
</tr>{% endfor %}</tbody></table></div>{% endblock %}
