<form method="post">{% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
      {% if field.errors %}<div class="text-danger small">{{ field.errors|join:', ' }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-primary">Save</button>
  <a href="javascript:history.back()" class="btn btn-link">Cancel</a>
</form>
<script>document.querySelectorAll('input,select,textarea').forEach(el=>{
  if(!el.classList.contains('form-control')&&el.type!=='checkbox'&&el.type!=='submit')el.classList.add('form-control');
});</script>
