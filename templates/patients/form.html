{% extends 'base.html' %}{% block content %}<h1>Add patient</h1><p>Capture a new patient profile and contact information.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" class="form-grid">{% csrf_token %}<label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Date of birth<input name="dob" type="date" required></label><label>Gender<select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Phone<input name="phone" placeholder="+27831234599"></label><label>Email<input name="email" type="email"></label><label>Street<input name="street" value="12 Demo Street"></label><label>City<input name="city" value="Mahikeng"></label><label>Province<input name="province" value="North West"></label><label>Postal Code<input name="postal_code" value="2745"></label><label>Passport number<input name="passport" placeholder="optional auto if blank"></label><label>Blood Type<select name="blood_type"><option></option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Emergency name<input name="emergency_name"></label><label>Emergency phone<input name="emergency_phone"></label><label>Ward<select name="ward_id"><option value="">Outpatient</option>{% for w in wards %}<option value="{{ w.WardID }}">{{ w.WardName }}</option>{% endfor %}</select></label><div></div><button class="btn">Save patient</button></form>{% endblock %}
