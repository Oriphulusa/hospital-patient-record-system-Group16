{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h4>Medications</h4>
{% if is_admin or is_doctor %}<a href="{% url 'pharmacy:med_create' %}" class="btn btn-primary"><i class="bi bi-plus"></i> Add Med</a>{% endif %}</div>
<div class="card"><table class="table mb-0">
<thead class="table-light"><tr><th>Name</th><th>Stock</th><th>Unit Price</th></tr></thead>
<tbody>{% for m in meds %}<tr>
  <td>{{ m.name }}</td>
  <td>{% if m.stock < 10 %}<span class="text-danger">{{ m.stock }}</span>{% else %}{{ m.stock }}{% endif %}</td>
  <td>${{ m.unit_price }}</td>
</tr>{% endfor %}</tbody></table></div>{% endblock %}
