{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between mb-3"><h4>Lab Tests</h4>
{% if is_admin %}<a href="{% url 'laboratory:test_create' %}" class="btn btn-primary"><i class="bi bi-plus"></i> Add Test</a>{% endif %}</div>
<div class="card"><table class="table mb-0">
<thead class="table-light"><tr><th>Name</th><th>Price</th></tr></thead>
<tbody>{% for t in tests %}<tr><td>{{ t.name }}</td><td>${{ t.price }}</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
